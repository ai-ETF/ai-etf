name: 集成测试

# 干什么：在 GitHub 的 Ubuntu 机器上起一个本地 Supabase（Docker），跑
# `pytest -m integration tests/integration`（当前 90 条）。
#
# ⚠️ 目前**只允许手动触发**（Actions 页面点 "Run workflow"）。
#    原因：有 7 条固定失败（PR #18 带来，见 docs/integration/03 与 06），
#    现在挂到 push/PR 上会每次都红，制造假信号。
#    等这 7 条处理完，再取消 `workflow_dispatch` 下面的注释。
#
# 为什么 E2E 不能放 CI：E2E 要 Windows + 微信开发者工具图形界面 + 本地后端，
# Linux runner 上必然失败。集成测试只依赖 Linux + Docker，所以可以跑。

on:
  workflow_dispatch: # 手动触发；稳定后再加 push / pull_request

jobs:
  integration:
    runs-on: ubuntu-latest
    # 首次运行要拉 Supabase 镜像 + 下载嵌入模型，给足时间。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本机实测一致（Python 3.12）；pyproject 声明 ^3.10，锁文件在 3.12 上解出。
          python-version: "3.12"

      - name: 安装 poetry
        run: pipx install poetry==2.4.1

      - name: 让虚拟环境落在仓库内（便于缓存）
        run: poetry config virtualenvs.in-project true

      - name: 缓存虚拟环境
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: 安装依赖
        run: poetry install --no-root

      # local_models/ 被 .gitignore 排除，clone 拿不到；约 491 MB。
      # 这是整个 job 里唯一需要外网的一步（测试本身有出网守卫）。
      - name: 缓存嵌入模型
        uses: actions/cache@v4
        with:
          path: local_models/text2vec-base-chinese
          key: text2vec-base-chinese-v1

      - name: 下载嵌入模型（缓存未命中时）
        run: |
          if [ ! -f local_models/text2vec-base-chinese/model.safetensors ]; then
            poetry run python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "shibing624/text2vec-base-chinese",
              local_dir="local_models/text2vec-base-chinese",
          )
          PY
          fi

      - name: 安装 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # 只起测试用到的服务，省内存（runner 约 7 GB）。
      # 迁移与 seed.sql（21 条费率规则）由 start 自动执行。
      - name: 启动本地 Supabase 栈
        run: |
          supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio,analytics

      - name: 导出本地栈连接信息
        run: |
          supabase status -o env > /tmp/supabase.env
          echo "TEST_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: 跑集成测试
        run: poetry run pytest -m integration tests/integration -q
