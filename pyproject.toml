[tool.poetry]
name = "ai-etf"
version = "0.1.0"
description = "AI-ETF 是一个使用人工智能技术分析交易所交易基金(ETF)的项目"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
pypdf = "^4.0.0"
pdfplumber = "^0.7.1"
scikit-learn = "^1.3.0"
python-dotenv = "^1.0.0"

# === 新增以下关键AI依赖 ===
# 1. 数据处理基础库
numpy = "^1.24.0"

# 2. 核心：从你配置的专属源安装CPU版本的PyTorch

# 3. 文本嵌入模型库
sentence-transformers = "^3.0.0"

# 4. LangChain生态库（根据你的代码按需添加）
langchain = {version = "^0.3.0", extras = ["anthropic"]}
langchain-openai = "^0.3.0"
langchain-anthropic = "^0.3.0"
langgraph = "^0.2.0"
langgraph-cli = {version = "^0.2.0", extras = ["inmem"]}

# 5. ETF 数据源
akshare = "^1.12.0"
cozepy = "^0.19.0"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
supabase = "^2.27.0"
torch = {version = "2.9.1+cpu", source = "pytorch-cpu"}

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"