[project]
name = "test-read-two-pdf"
version = "0.1.0"
description = ""
authors = [
    {name = "lai",email = "laihaidada@163.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pysqlite3-binary (>=0.5.4,<0.6.0)",
    "pysqlite3 (>=0.5.4,<0.6.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.0.1,<8.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "pdfplumber (>=0.11.7,<0.12.0)",
    "sentence-transformers (>=5.1.1,<6.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "cozepy (>=0.19.0,<0.20.0)",
    "langgraph (>=1.0.1,<2.0.0)",
    "langchain[anthropic] (>=1.0.1,<2.0.0)",
    "langchain-openai (>=1.0.1,<2.0.0)",
    "langgraph-cli[inmem] (>=0.4.4,<0.5.0)"
]

[tool.poetry]
packages = [{include = "test_read_two_pdf", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
